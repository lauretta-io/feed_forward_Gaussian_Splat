runtime:
  role: wingman
  node_id: wingman_01
  log_level: INFO
  json_logs: false
  output_dir: outputs/ariadne/wingman_01
wingman:
  local_frame: local_wingman_01
  body_frame: body
  preprocessing:
    width: 64
    height: 64
    min_blur_score: 0.002
    min_exposure_score: 0.15
    max_occlusion_fraction: 0.55
  saliency:
    backend: u2net
    model_path: .cache/ariadne/models/u2net/u2net.pth
    device: auto
    input_size: 320
    threshold: 0.5
    quantile: 0.82
    contrast_weight: 0.45
    min_area_px: 4
    max_regions: 32
  object_store:
    max_objects: 256
    max_keyframes_per_object: 4
    snapshot_path: outputs/ariadne/wingman_01/local-objects.json
  transport:
    queue_capacity: 128
    max_payload_bytes: 64000
    packet_ttl_seconds: 60.0
    max_retries: 3
    retry_interval_seconds: 0.25
    dedupe_entries: 1024
  correction:
    max_translation_step_m: 0.5
    max_total_translation_m: 10.0
    max_rotation_step_rad: 0.1
    max_total_rotation_rad: 0.5
    max_generated_history: 1024
    max_applied_history: 4096
    generator_snapshot_path: null
    applier_snapshot_path: outputs/ariadne/wingman_01/correction-applier.json
    ttl_seconds: 60.0
  telemetry:
    max_distribution_samples: 1024
    max_metrics: 256
    max_events: 1024
  security:
    max_envelope_ttl_seconds: 60.0
    replay_window_entries: 4096
  deployment:
    profile: cpu_reference
